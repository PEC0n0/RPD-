<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>RPD通用一起看</h1>
      <span id="stateBadge" class="badge idle">未连接</span>
    </header>

    <section class="card">
      <label>
        房间号
        <input id="room" type="text" placeholder="例如 1234" autocomplete="off" />
      </label>
      <label>
        密码
        <input id="password" type="password" placeholder="房间密码" autocomplete="off" />
      </label>

      <details>
        <summary>高级：信令服务器地址</summary>
        <label>
          服务器
          <input id="signalUrl" type="text" value="wss://rpd-together.onrender.com" spellcheck="false" />
        </label>
      </details>

      <div class="row">
        <button id="joinBtn" class="primary">加入 / 创建房间</button>
        <button id="leaveBtn">离开</button>
      </div>
      <p id="hint" class="hint"></p>
    </section>

    <section class="card">
      <div class="status-line"><span>连接状态</span><b id="stState">—</b></div>
      <div class="status-line"><span>我的角色</span><b id="stRole">—</b></div>
      <div class="status-line"><span>对方在线</span><b id="stPeer">—</b></div>
      <div class="status-line"><span>P2P 通道</span><b id="stDc">—</b></div>
    </section>

    <section class="card">
      <button id="syncBtn" class="primary full">同步当前页面给房间</button>
      <label class="check">
        <input id="autoFollow" type="checkbox" checked />
        自动跟随对方跳页
      </label>
    </section>

    <section class="card">
      <div class="row">
        <input id="testText" type="text" placeholder="发送一条测试消息" />
        <button id="testBtn">发送</button>
      </div>
      <div id="log" class="log"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
