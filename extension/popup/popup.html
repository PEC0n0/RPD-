<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>RPD通用一起看</h1>
      <span id="stateBadge" class="badge idle">未连接</span>
    </header>

    <section class="card">
      <label>
        房间号
        <input id="room" type="text" placeholder="例如 1234" autocomplete="off" />
      </label>
      <label>
        密码
        <input id="password" type="password" placeholder="房间密码" autocomplete="off" />
      </label>
      <label>
        昵称
        <input id="nickname" type="text" placeholder="你的昵称" autocomplete="off" />
      </label>

      <details>
        <summary>高级：信令服务器地址</summary>
        <label>
          服务器
          <input id="signalUrl" type="text" value="wss://rpd-together.onrender.com" spellcheck="false" />
        </label>
      </details>

      <div class="row">
        <button id="joinBtn" class="primary">加入 / 创建房间</button>
        <button id="leaveBtn">离开</button>
      </div>
      <p id="hint" class="hint"></p>
    </section>

    <section class="card">
      <div class="status-line"><span>连接状态</span><b id="stState">—</b></div>
      <div class="status-line"><span>房间成员</span><b id="memberList">—</b></div>
      <div class="status-line"><span>对方在线</span><b id="stPeer">—</b></div>
      <div class="status-line"><span>数据通道</span><b id="stDc">—</b></div>
    </section>

    <section class="card">
      <button id="syncBtn" class="primary full">同步当前页面给房间</button>
      <label class="check">
        <input id="autoFollow" type="checkbox" checked />
        自动跟随对方跳页
      </label>
    </section>

    <section class="card">
      <div class="row">
        <input id="testText" type="text" placeholder="发送一条测试消息" />
        <button id="testBtn">发送</button>
      </div>
      <div id="log" class="log"></div>
    </section>

    <section class="card about">
      <div class="about-title">RPD通用一起看 <span class="about-ver">v0.1.0</span></div>
      <div class="about-line">作者：PecoNorth · 永久免费</div>
      <div class="about-line">异地同看：输入相同房间号+密码建立连接，同步网页与视频进度。</div>
      <div class="about-line">反馈邮箱：2058064651@qq.com</div>
      <div class="about-support">
        <div class="about-support-title">喜欢这个插件？请我喝杯咖啡 ☕（点击二维码放大）</div>
        <div class="about-qr-row">
          <div class="qr-item">
            <img class="qr-img" src="../about/wechat.jpg" alt="微信赞赏" />
            <span>微信赞赏</span>
          </div>
          <div class="qr-item">
            <img class="qr-img" src="../about/alipay.jpg" alt="支付宝赞赏" />
            <span>支付宝赞赏</span>
          </div>
        </div>
      </div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
